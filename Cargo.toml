[package]
name = "trontop"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A fast, native Windows process and performance manager"
license = "Proprietary"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "wgpu"] }
egui_extras = "0.35.0"
sysinfo = "=0.38.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
