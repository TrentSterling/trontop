[package]
name = "trontop"
version = "0.3.0-alpha.38"
edition = "2024"
rust-version = "1.93"
description = "A fast, native Windows process and performance manager"
license = "Proprietary"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "wgpu"] }
# Keep egui memory serialization without eframe's blocking file-storage runner.
egui = { version = "0.35.0", default-features = false, features = ["persistence"] }
egui_extras = "0.35.0"
ron = "=0.12.2"
sysinfo = "=0.38.4"
serde_json = "=1.0.150"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21.3"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Com",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    # System specs page (src/specs). Read-only inventory queries only.
    "Win32_Devices_Bluetooth",
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Devices_Usb",
    "Win32_Globalization",
    "Win32_Graphics_Printing",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_Storage_Nvme",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Rpc",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Time",
    "Win32_System_TpmBaseServices",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_System_Wmi",
    "Win32_UI_Shell_PropertiesSystem",
    "Wdk_Graphics_Direct3D",
] }

[build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
# Offscreen visual QA only. No runtime assets, windows, or new EXE dependencies.
image = { version = "=0.25.10", default-features = false, features = ["png"] }
pollster = "=0.4.0"

[patch.crates-io]
# Repository-local device-loss recovery; no global Cargo cache modifications.
egui-wgpu = { path = "vendor/egui-wgpu" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
