[package]
name = "trontop"
version = "0.3.0-alpha.2"
edition = "2024"
rust-version = "1.93"
description = "A fast, native Windows process and performance manager"
license = "Proprietary"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "persistence", "wgpu"] }
egui_extras = "0.35.0"
sysinfo = "=0.38.4"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21.3"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
# Offscreen visual QA only. No runtime assets, windows, or new EXE dependencies.
image = { version = "=0.25.10", default-features = false, features = ["png"] }
pollster = "=0.4.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
