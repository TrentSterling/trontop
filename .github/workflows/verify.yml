name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: rustup override set 1.93.0
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check local renderer patch formatting
        run: rustfmt --edition 2024 --check vendor/egui-wgpu/src/recovery.rs vendor/egui-wgpu/src/winit.rs vendor/egui-wgpu/src/renderer.rs vendor/egui-wgpu/src/lib.rs
      - name: Run tests
        run: cargo test
      - name: Run strict Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check local renderer patch
        run: cargo clippy -p egui-wgpu --all-targets -- -D warnings
      - name: Build portable release executable
        run: cargo build --release
      - name: Package release with licenses and checksums
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: trontop-windows-${{ github.sha }}
          path: |
            target/release-package/trontop.exe
            target/release-package/*.zip
            target/release-package/SHA256SUMS.txt
            target/release-package/build-info.json
            LICENSE
            NOTICE
            THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 14
